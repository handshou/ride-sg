services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ride_sg
      POSTGRES_PASSWORD: ride_sg
      POSTGRES_USER: ride_sg
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride_sg -d ride_sg"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ride_sg_postgres_data:/var/lib/postgresql/data

volumes:
  ride_sg_postgres_data:
